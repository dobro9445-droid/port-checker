name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "port_checker_gui.py"
      - ".github/workflows/build-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE
        # Используем python -m PyInstaller для надежности и --noconfirm
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "PortCheckerGUI" "port_checker_gui.py"

      - name: Check if EXE exists
        run: |
          if (Test-Path "dist/PortCheckerGUI.exe") {
            Write-Host "EXE успешно создан!"
          } else {
            Write-Error "EXE не найден в папке dist!"
            exit 1
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortCheckerGUI-windows
          path: dist/PortCheckerGUI.exe
