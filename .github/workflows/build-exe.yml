name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "port_checker_gui.py"
      - ".github/workflows/build-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name PortCheckerGUI --clean port_checker_gui.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortCheckerGUI-windows
          path: dist/PortCheckerGUI.exe
